<!DOCTYPE html>
<html>
<head>
    <title>Anonymous Tip-Box</title>
    <style>
        body {
            background-color: #0a192f;font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: rgb(197, 77, 171);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
        }
        textarea {font-size: 12PT;font-weight: bold;font-family: inherit;
            width: 100%;
            height: 120px;
            margin: 15px 0;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #333;
            background: #474343;
            color: rgb(248, 246, 248);
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0d7fb4af;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {button:hover {
    background-color: #0ae60296; /* This turns the button Orange on hover */
    transform: scale(1.05);    /* This makes the button pop out slightly */
    transition: 0.3s;          /* This makes the color change smooth, not jumpy */
}; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Anonymous Tip-Box</h2>
        <p>Your message is completely private.</p>
        <form id="tipForm">
            <textarea id="tipText" placeholder="Enter your tip here..." required></textarea>
            <button type="submit">Submit Anonymously</button>
        </form>
    </div>

    <script>
        // This handles the "alert on submit" requirement
        document.getElementById('tipForm').onsubmit = function(event) {
            event.preventDefault();
            alert("Tip submitted successfully!");
            document.getElementById('tipText').value = "";
        };
    </script>

</body>
</html>
